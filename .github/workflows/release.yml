name: Release

# Push a tag like v0.2.0 to build the Windows installer and a portable zip and publish them as a
# GitHub release. The tag must match the version in pyproject.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build the app
        run: pyinstaller --noconfirm polyglass.spec

      - name: Smoke-test the build
        shell: pwsh
        run: |
          # The packaged app renders a sample page and reads it back with Windows OCR
          $run = Start-Process dist/Polyglass/Polyglass.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA/Polyglass/logs/polyglass.log" -Tail 5
          if ($run.ExitCode -eq 2) { "No French or English OCR language on this runner; skipping the OCR check" }
          elseif ($run.ExitCode -ne 0) { throw "Self-test failed with exit code $($run.ExitCode)" }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer/polyglass.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/Polyglass -DestinationPath "dist/Polyglass-$env:VERSION-portable.zip"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "See CHANGELOG.md for what changed. Windows may show a SmartScreen warning because the installer is not code-signed yet: choose More info, then Run anyway."
          gh release create "${{ github.ref_name }}" "dist/Polyglass-$env:VERSION-setup.exe" "dist/Polyglass-$env:VERSION-portable.zip" --title "Polyglass $env:VERSION" --notes $notes
