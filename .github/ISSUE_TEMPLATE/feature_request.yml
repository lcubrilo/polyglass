name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way. The "why" matters more than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea for a solution
