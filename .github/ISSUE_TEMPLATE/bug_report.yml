name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help a lot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Polyglass version
      description: Tray menu → About
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: setup
    attributes:
      label: Translator and languages
      placeholder: DeepL, French → English
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Tray menu → Open log folder → polyglass.log. Remove anything private before pasting.
      render: text
